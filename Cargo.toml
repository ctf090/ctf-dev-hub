[package]
name = "bio-site"
version = "0.2.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "Node", "EventTarget",
    "HtmlElement", "Navigator", "Response", "MouseEvent",
    "DomRect", "CssStyleDeclaration",
] }

# Build menor/mais rápido de carregar no navegador
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
